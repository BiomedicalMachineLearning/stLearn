[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stlearn"
version = "1.5.0"
authors = [
    { name = "Genomics and Machine Learning Lab", email = "andrew.newman@uq.edu.au" },
]
description = "A downstream analysis toolkit for Spatial Transcriptomic data"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12.2",
    "bokeh>=3.7.0,<4.0",
    "click>=8.2.0,<9.0",
    "igraph>=1.0.0",
    "leidenalg>=0.11.0",
    "numba>=0.64.0",
    "numpy>=2.4.0",
    "pillow>=12.0.0,<13.0",
    "scanpy>=1.12.0",
    "scikit-image>=0.25.0",
    "pandas>=2.3.0",
    "imageio>=2.37.0,<3.0",
    "scipy>=1.17.1,<2.0",
    "scikit-learn>=1.8.0,<2.0",
    "scikit-misc>=0.5.1",
    "zarr>=3.1.6,<4.0",
    "dask>=2025.12.0",
    "spatialdata>=0.7.3",
    "spatialdata-io>=0.6.0",
    "spatialdata-plot>=0.3.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "geopandas>=1.0.0,<2.0",
    "shapely>=2.0.6,<3.0",
    "pooch[progress]>=1.8.1",
    "requests>=2.32.4",
    "tifffile>=2026.5.2",
    "umap-learn>=0.5.12",
    "openpyxl>=3.1",
]

keywords = ["stlearn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.16.10",
    "mypy>=2.0",
    "pytest>=7.0",
    "tox>=4.0",
    "ghp-import>=2.1.0",
    "sphinx>=4.0",
    "furo==2024.8.6",
    "myst-parser>=0.18",
    "nbsphinx>=0.9.0",
    "types-tensorflow>=2.8.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-autosummary-accessors>=2023.4.0",
]
test = [
    "pytest",
    "psutil",
    "pytest-cov",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "ipywidgets>=8.0.0",
    "plotly>=5.0.0",
    "bokeh>=3.7.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/GenomicsMachineLearning/stLearn2"
Repository = "https://github.com/GenomicsMachineLearning/stLearn2"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["stlearn", "stlearn.*"]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not acceptance'"
markers = [
    "acceptance: takes minutes; deselected by default, run with pytest -m acceptance",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", "__pycache__", "build", "dist", "docs/_build"]

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle + pyflakes
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "NPY", # numpy-specific (NPY001, NPY002, NPY003, NPY201)
    "PD", # pandas-vet
    "B", # flake8-bugbear (catches real bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E722", # bare except — you've already accepted these
    "F811", # redefinition — accepted
    "N803", "N806", # naming: lowercase args/vars — too invasive to fix
    "N818", # exception naming
    "PD011", # .values vs .to_numpy() — too noisy, mostly false positives
    "B008", # function calls in default args — used by typer/click
    "SIM108", # ternary suggestions can hurt readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "N"]                 # tests can be loose
"docs/conf.py" = ["E", "F", "UP"]      # generated/config file
"**/__init__.py" = ["F401"]            # re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.importlinter]
root_package = "stlearn"

[[tool.importlinter.contracts]]
name = "cci is layered"
type = "layers"
containers = ["stlearn.tl.cci"]
layers = [
    "analysis",
    "permutation | het | edges | gridding | go",
    "perm_utils",
    "scoring | neighbours",
    "_results | r_helpers",
]